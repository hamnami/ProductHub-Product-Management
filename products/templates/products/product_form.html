{% extends 'products/base.html' %}{% block content %}<div class="form-card"><h1>{{ title }}</h1><p>Enter product information below.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{% if field.field.required %} *{% endif %}</label>{{ field }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}{% endfor %}<div class="form-actions"><a href="{% url 'product_list' %}">Cancel</a><button class="primary">Save Product</button></div></form></div>{% endblock %}
